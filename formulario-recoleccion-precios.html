<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recolector de Precios - App Gasolinas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        select,
        input[type="number"],
        input[type="file"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        select:focus,
        input[type="number"]:focus,
        input[type="file"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .price-input {
            position: relative;
        }

        .price-input::before {
            content: '$';
            position: absolute;
            left: 12px;
            top: 38px;
            color: #999;
            font-size: 16px;
            font-weight: bold;
        }

        .price-input input {
            padding-left: 28px;
        }

        .photo-preview {
            margin-top: 10px;
            border-radius: 6px;
            max-width: 100%;
            max-height: 200px;
            display: none;
        }

        .photo-preview.show {
            display: block;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            grid-column: span 2;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
        }

        .btn-reset:hover {
            background: #e8e8e8;
        }

        .status-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
            text-align: center;
            font-size: 14px;
        }

        .status-message.show {
            display: block;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-message.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⛽ Recolector de Precios</h1>
            <p>App Gasolinas Ecuador</p>
        </div>

        <div class="info-box">
            💡 <strong>Instrucciones:</strong> Selecciona la gasolinera, tipo de combustible, ingresa el precio y carga la foto del cartel.
        </div>

        <form id="formRecolector">
            <!-- GASOLINERA -->
            <div class="form-group">
                <label for="gasolinera">* Gasolinera</label>
                <select id="gasolinera" required>
                    <option value="">-- Selecciona una gasolinera --</option>
                    <option value="PRIMAX VISTA AL VALLE">PRIMAX VISTA AL VALLE (Norte)</option>
                    <option value="MASGAS FULL SERVICE">MASGAS FULL SERVICE (Sur)</option>
                    <option value="GASOLINERA PETROCOMERCIAL">GASOLINERA PETROCOMERCIAL (Norte)</option>
                    <option value="PRIMAX AMERICA ATIMASA">PRIMAX AMERICA ATIMASA (Centro)</option>
                </select>
            </div>

            <!-- TIPO COMBUSTIBLE Y PRECIO -->
            <div class="form-row">
                <div class="form-group">
                    <label for="tipoCombustible">* Tipo Combustible</label>
                    <select id="tipoCombustible" required>
                        <option value="">-- Selecciona --</option>
                        <option value="Extra">Extra</option>
                        <option value="Super">Super</option>
                        <option value="Diesel">Diesel</option>
                        <option value="Ecopaís">Ecopaís</option>
                    </select>
                </div>

                <div class="form-group price-input">
                    <label for="precio">* Precio (USD)</label>
                    <input
                        type="number"
                        id="precio"
                        step="0.01"
                        min="0.5"
                        max="10"
                        placeholder="0.00"
                        required
                    >
                </div>
            </div>

            <!-- FOTO -->
            <div class="form-group">
                <label for="foto">📸 Foto del Cartel</label>
                <input type="file" id="foto" accept="image/*" capture="environment">
                <img id="photoPreview" class="photo-preview" alt="Vista previa de foto">
            </div>

            <!-- NOTAS (OPCIONAL) -->
            <div class="form-group">
                <label for="notas">📝 Notas (Opcional)</label>
                <textarea
                    id="notas"
                    rows="3"
                    placeholder="Ej: Precio de promoción, horario especial, etc."
                ></textarea>
            </div>

            <!-- BOTONES -->
            <div class="button-group">
                <button type="reset" class="btn-reset">Limpiar</button>
                <button type="submit" class="btn-submit">Guardar Precio</button>
            </div>
        </form>

        <!-- MENSAJE DE ESTADO -->
        <div id="statusMessage" class="status-message"></div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:3000/api';

        // Cargar lista de gasolineras desde la API
        async function cargarGasolineras() {
            try {
                const response = await fetch(`${API_URL}/gasolineras`);
                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    const selectGasolinera = document.getElementById('gasolinera');
                    selectGasolinera.innerHTML = '<option value="">-- Selecciona una gasolinera --</option>';

                    data.data.forEach(gasolinera => {
                        const option = document.createElement('option');
                        option.value = gasolinera.id;
                        option.textContent = `${gasolinera.nombre} (${gasolinera.ciudad})`;
                        selectGasolinera.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error cargando gasolineras:', error);
                mostrarMensaje('Error cargando gasolineras. Verifica que el servidor esté corriendo.', 'error');
            }
        }

        // Vista previa de foto
        document.getElementById('foto').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const preview = document.getElementById('photoPreview');
                    preview.src = event.target.result;
                    preview.classList.add('show');
                };
                reader.readAsDataURL(file);
            }
        });

        // Enviar formulario
        document.getElementById('formRecolector').addEventListener('submit', async (e) => {
            e.preventDefault();

            const gasolineraId = document.getElementById('gasolinera').value;
            const tipoCombustible = document.getElementById('tipoCombustible').value;
            const precio = parseFloat(document.getElementById('precio').value);
            const fotoFile = document.getElementById('foto').files[0];
            const notas = document.getElementById('notas').value;

            if (!gasolineraId || !tipoCombustible || !precio) {
                mostrarMensaje('Por favor completa todos los campos requeridos', 'error');
                return;
            }

            mostrarMensaje('<span class="loading-spinner"></span>Guardando...', 'loading');

            try {
                // Paso 1: Subir foto (si existe)
                let fotoUrl = null;
                if (fotoFile) {
                    // Por ahora, simulamos que se guarda
                    // En Semana 2 integraremos Supabase Storage
                    console.log('Foto seleccionada:', fotoFile.name);
                }

                // Paso 2: Enviar precio a la API
                // Generar UUID válido para el usuario
                const usuarioId = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => (c === 'x' ? Math.random() * 16 | 0 : (Math.random() * 16 | 0 & 0x3 | 0x8)).toString(16));

                const response = await fetch(`${API_URL}/precios/reportar`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        gasolinera_id: gasolineraId,
                        usuario_id: usuarioId,
                        tipo_combustible: tipoCombustible,
                        precio: precio,
                        foto_url: fotoUrl,
                        ubicacion_gps: {
                            latitud: -0.2173,
                            longitud: -78.5089
                        }
                    })
                });

                const result = await response.json();

                if (result.success) {
                    mostrarMensaje('✅ ¡Precio guardado correctamente!', 'success');
                    document.getElementById('formRecolector').reset();
                    document.getElementById('photoPreview').classList.remove('show');
                    setTimeout(() => {
                        document.getElementById('statusMessage').classList.remove('show');
                    }, 3000);
                } else {
                    mostrarMensaje(`❌ Error: ${result.message}`, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error al guardar. Verifica la conexión y que el servidor esté corriendo.', 'error');
            }
        });

        // Mostrar mensaje de estado
        function mostrarMensaje(texto, tipo) {
            const messageEl = document.getElementById('statusMessage');
            messageEl.innerHTML = texto;
            messageEl.className = `status-message show ${tipo}`;
        }

        // Cargar gasolineras al iniciar
        cargarGasolineras();
    </script>
</body>
</html>
